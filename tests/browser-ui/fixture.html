<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>take-screenshot fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; background: #fbf6ee; color: #2b2520; }
  section { margin: 24px; padding: 16px; border: 2px solid #b5543a; }
  #contents { display: contents; }
  h2 { margin: 0 0 12px; }
  .row { display: flex; gap: 8px; }
  .chip { padding: 4px 12px; border-radius: 999px; background: #fbe4db; }
</style>
</head>
<body>
  <section><h2>Boxed</h2><div class="row"><span class="chip">One</span><span class="chip">Two</span></div></section>
  <section id="contents"><h2>Contents</h2><div class="row"><span class="chip">Three</span><span class="chip">Four</span></div></section>
</body>
</html>
