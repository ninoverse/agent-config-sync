name: Release

# Unlike every other workflow here, this one is not a thin caller into
# ninoverse/.github. There is no reusable Rust release workflow there, and this
# is the only repository in the organization that publishes binaries, so it was
# written in place rather than blocking the rest of Stage 4 on it. Lifting it
# into ninoverse/.github/.github/workflows/rust-release.yml@v1 is the intended
# end state; docs/plan.md records that under *Deferred on purpose*.
#
# The tag this watches for is the one bump-version.yml pushes. That only works
# because that workflow pushes with a GitHub App token: a tag pushed with
# GITHUB_TOKEN deliberately does not trigger other workflows, so this would
# never fire.
#
# What it publishes is one static binary per target, named after that target and
# nothing else — the tag is already in the download URL, and the `just agentcfg`
# recipe and Renovate's post-upgrade task both build that URL by hand. Renaming
# an asset breaks both, in every consumer repository at once.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # For re-running a release whose assets failed to upload. Pick the tag as the
  # ref; the workflow reads the tag it was dispatched on, not `main`.
  workflow_dispatch:

permissions:
  contents: read

# A re-run of the same tag must not race the first. Queue rather than cancel:
# cancelling between the upload and the release leaves a tag with some of its
# assets and no release to hold them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Every row builds for the architecture it runs on, so there is no
          # cross-linker, no `cross`, and no zig. musl is still a target add on
          # the Linux rows — static linking is the point, and the dependency set
          # is pure Rust, so rustc's own self-contained musl objects link it
          # with nothing installed.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The build command itself lives in the justfile, like every other command
      # in this repository. `just dist <target>` is the same line here and on a
      # laptop, which is what makes a release reproducible by hand.
      - name: Install just
        run: cargo install --locked just

      - name: Build
        run: just dist ${{ matrix.target }}

      - name: Name it after its target
        run: mv target/${{ matrix.target }}/release/agentcfg agentcfg-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: agentcfg-${{ matrix.target }}
          path: agentcfg-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the binaries to it.
      contents: write
    steps:
      # Full history: the notes are a diff against the previous tag, and
      # `git describe` cannot find one in the shallow clone checkout defaults to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: agentcfg-*
          merge-multiple: true

      # Written by the very binary this release publishes, so the summary and
      # the artifact can never describe different trees. Renovate embeds this
      # body in every bump pull request it opens, which is what keeps the Monday
      # pull request readable in every repository that pins us.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "${TAG}^")
          echo "Comparing fragments against ${previous}"

          mkdir previous-fragments
          git archive "${previous}" fragments \
            | tar -x -C previous-fragments --strip-components=1

          chmod +x agentcfg-*
          ./agentcfg-x86_64-unknown-linux-musl \
            notes --previous previous-fragments > notes.md
          cat notes.md

      - name: Checksum the binaries
        run: sha256sum agentcfg-* > SHA256SUMS

      # Creating and re-running are the same command as far as a maintainer is
      # concerned, so both work. Without the second branch the manual re-run
      # above would be decoration: a run that died mid-upload leaves the release
      # already created, and `gh release create` refuses to touch it.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --clobber agentcfg-* SHA256SUMS
            gh release edit "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file notes.md \
              agentcfg-* SHA256SUMS
          fi
