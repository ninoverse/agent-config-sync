name: Release

# A caller into ninoverse/.github, like every other workflow here. It was the
# one exception until Stage 4 built the shared Rust release path: no reusable
# release workflow existed, so this one was written in place.
#
# The shared workflow builds one static binary per target, attaches them to the
# tag's release with a SHA256SUMS, and generates the conventional-commit
# changelog. What it cannot generate is what this repository knows about itself,
# which is what the notes job below supplies through `extra-notes`.
#
# The tag this watches for is the one bump-version.yml pushes. That only works
# because that workflow pushes with a GitHub App token: a tag pushed with
# GITHUB_TOKEN deliberately does not trigger other workflows, so this would
# never fire.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # For re-running a release whose assets failed to upload. Pick the tag as the
  # ref; the workflow reads the tag it was dispatched on, not `main`.
  workflow_dispatch:

permissions:
  contents: read

# A re-run of the same tag must not race the first. Queue rather than cancel:
# cancelling between the upload and the release leaves a tag with some of its
# assets and no release to hold them. It belongs here rather than in the called
# workflow, where `github.workflow` would still resolve to this caller's name.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Renovate embeds a release's body in the bump pull request it opens in every
  # repository that pins us, so this summary is written once here instead of
  # being computed seventy-five times. The shared workflow prepends it above the
  # changelog, because the rules are what a consumer is reading for.
  notes:
    name: Summarize the fragment changes
    runs-on: ubuntu-latest
    outputs:
      extra: ${{ steps.notes.outputs.extra }}
    steps:
      # Full history: the notes are a diff against the previous tag, and
      # `git describe` cannot find one in the shallow clone checkout defaults to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Built from this tag rather than downloaded, and a debug build because
      # only the output matters. build.rs embeds `fragments/` whatever the
      # profile, so the tree this describes is the tree the published binaries
      # carry — the summary and the artifacts cannot disagree.
      - name: Diff this tag's fragments against the previous release
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "${TAG}^")
          echo "Comparing fragments against ${previous}"

          mkdir previous-fragments
          git archive "${previous}" fragments \
            | tar -x -C previous-fragments --strip-components=1

          cargo run --quiet --locked -p agentcfg -- \
            notes --previous previous-fragments > notes.md
          cat notes.md

          # A random delimiter because the value is multi-line: a fixed one
          # appearing in the notes would let the value break out of its own
          # heredoc and corrupt every later output in the file.
          delimiter=$(openssl rand -hex 16)
          {
            echo "extra<<${delimiter}"
            cat notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: notes
    # Required here, on the calling job. A called workflow can only downgrade
    # the permissions it is given, never raise them, so the `contents: write`
    # its release job asks for is capped by whatever this grants — and the
    # workflow-level `contents: read` above would cap it at read.
    permissions:
      contents: write
    # Pinned to a released version, not @main or a short @v1: @main lands here
    # with no pull request, and @v1 never moves. Renovate opens the bump.
    uses: ninoverse/.github/.github/workflows/rust-release.yml@v1.1.1
    with:
      binary: agentcfg
      targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-apple-darwin
      extra-notes: ${{ needs.notes.outputs.extra }}
