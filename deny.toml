[graph]
all-features = true

[licenses]
# What the tree actually pulls in, not a wishlist. cargo-deny warns on an
# allowance nothing matches, so the list stays honest by being checked rather
# than by being remembered. A dependency under a licence not named here fails
# gate 4 — that is the prompt to read the licence and add it deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    # The icu_* chain, reached through idna.
    "Unicode-3.0",
]
confidence-threshold = 0.93

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
