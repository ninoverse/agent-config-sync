[graph]
all-features = true

[licenses]
# What the tree actually pulls in, not a wishlist. cargo-deny warns on an
# allowance nothing matches, so the list stays honest by being checked rather
# than by being remembered. A dependency under a licence not named here fails
# gate 4 — that is the prompt to read the licence and add it deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    # The icu_* chain, reached through idna.
    "Unicode-3.0",
]
confidence-threshold = 0.93

[advisories]
yanked = "deny"
# Each entry says why it is safe to carry, and goes once that stops being true.
ignore = [
    # serde_yaml_ng, which reads .agentprofile.yml, pulls in unsafe-libyaml,
    # archived upstream with no safe upgrade. It goes once agentcfg moves to a
    # YAML parser written in safe Rust.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; serde_yaml_ng has no release without it" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
