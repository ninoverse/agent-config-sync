# Vocabulary the core fragments substitute. Every language value defines the
# same names; see docs/fragment-authoring.md.
unit: "package"
units: "packages"
unit_container: "workspace"
gate_command: "pnpm run ci"
gates: "every gate"
gates_clean: "zero warnings"
unit_lint_command: "pnpm --filter <package> run lint"
unit_test_command: "pnpm --filter <package> test"
version_floor: "`engines.node` floor"
lint_suppression: "`biome-ignore` or `@ts-expect-error` suppression"
dependency_bump_example: "vite to 7.1.0"
breaking_change_example: "drop support for Node 20"
