# Brief: what the project is for, how it will be judged, and the ground rules
# the user set for working on it. The next session reads this first.

[[section]]
id = "the-project"
title = "The project"
kind = "defs"

[[section.def]]
term = "Problem"
text = "The platform restarts <code>example-service</code> only when the process dies, and sends it traffic while its database is down."

[[section.def]]
term = "Objective"
text = "A liveness probe and a readiness probe that the platform uses."

[[section.def]]
term = "In scope"
text = "The two routes, the platform's settings that point at them, and their timeouts."

[[section.def]]
term = "Out of scope"
text = "Dashboards for the probes: that is [[T1]]."

# Success criteria are judged in Verify, which sets their status. A criterion's
# `needs` are the checks that prove it: its card says Verified by, and each
# check's says Verifies.
[[section]]
id = "criteria"
title = "Success criteria"
kind = "items"
type = "criterion"

[[section.item]]
id = "SC1"
title = "A process that hangs is restarted"
short = "Hangs restart"
needs = ["C1"]

[[section.item]]
id = "SC2"
title = "A process without its database gets no traffic"
short = "No traffic without a database"
needs = ["C2"]

# Each repository the project involves, and what it does with it: `change`
# (its PRs land there), `read` (nothing in it changes) or `new` (it creates it).
[[section]]
id = "repositories"
title = "Repositories"
kind = "repos"

[[section.repo]]
name = "example-service"
use = "change"
part = "The routes, and the deployment settings."

[[section.repo]]
name = "platform-docs"
use = "read"
part = "What the platform expects of a probe, and its defaults."

[[section]]
id = "ground-rules"
title = "Ground rules"
kind = "items"
type = "rule"

[[section.item]]
id = "G1"
title = "PRs open ready for review, never as drafts"
fields = [["Since", "1 October."]]

[[section.item]]
id = "G2"
title = "Only the user merges"
fields = [["Since", "1 October."]]

[[section.item]]
id = "G3"
title = "Ask before using a branch the plan doesn't name"
fields = [["Since", "1 October."]]
