# Plan: the PRs as approved, the settings only the user can change, and the
# risk register. Their statuses live in build.toml, under [status], so this
# phase keeps the plan as it was approved. An item added after `approved` says
# so with `amended`.
intro = "One PR at a time, each with what proves it works, and one setting only you can change."
approved = 2026-10-03

[[section]]
id = "prs"
title = "The PRs"
kind = "items"
type = "pr"

# `kind` is what a merge releases (major, minor, patch), or you or together.
# `short` names the item wherever it is linked. `needs` lists what has to be
# done first: it decides the board's waves, and a loop in it fails the render.
[[section.item]]
id = "EX-1"
title = "<code>feat: add the liveness probe</code>"
short = "Liveness probe"
kind = "minor"
fields = [
  ["Branch", "<code>feat/liveness-probe</code>"],
  ["Changes", "A <code>/healthz</code> route that answers 200 while the process runs."],
  ["Carries out", "[[D1]]"],
  ["Releases", "A minor version."],
  ["Done when", "In staging, a process whose <code>/healthz</code> stops answering is restarted."],
]

[[section.item]]
id = "EX-2"
title = "<code>feat: add the readiness probe</code>"
short = "Readiness probe"
kind = "minor"
needs = ["EX-1"]
due = 2026-10-14
fields = [
  ["Branch", "<code>feat/readiness-probe</code>"],
  ["Changes", "A <code>/readyz</code> route that answers 200 only while the database connection is up."],
  ["Carries out", "[[D1]] and [[D2]]"],
  ["Releases", "A minor version."],
  ["Done when", "In staging, a process that loses its database gets no traffic until the connection is back."],
]

[[section.item]]
id = "EX-3"
title = "<code>fix: allow ten seconds for readiness in production</code>"
short = "Ten seconds in production"
kind = "patch"
needs = ["Q1"]
amended = { on = 2026-10-07, why = "the answer to [[Q1]]" }
fields = [
  ["Branch", "<code>fix/readiness-timeout</code>"],
  ["Changes", "The production readiness probe allows ten seconds instead of five."],
  ["Releases", "A patch."],
  ["Done when", "A slow night in production takes no process out of service."],
]

[[section]]
id = "settings"
title = "Settings only you can change"
kind = "items"
type = "setting"

[[section.item]]
id = "S1"
title = "Point the platform's probes at the new routes"
short = "Probe routes"
kind = "you"
needs = ["EX-1"]
fields = [["Where", "The service's deployment settings."]]

[[section]]
id = "risks"
title = "Risk register"
kind = "items"
type = "risk"

[[section.item]]
id = "RK1"
title = "A slow database fails readiness and takes every process out of service at once"
short = "Slow database"
needs = ["EX-3"]
