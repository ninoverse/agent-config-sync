# Build: the live state. [status.<id>] sets the status of an item kept in
# another phase: done, open (waiting on the user), ready, blocked (with `waits`
# or the item's `needs`) or dropped (with `why`); `on`, the day it got there;
# and a `result` once it lands.
intro = "Where each PR, setting and risk stands."

[status.EX-1]
status = "done"
on = 2026-10-06
result = "Released 1.4.0. In staging, a process whose <code>/healthz</code> was blocked restarted 30 seconds later."

[status.S1]
status = "done"
on = 2026-10-06
result = "Both probes point at the new routes."

[status.EX-2]
status = "open"
on = 2026-10-07
result = "Open and green, waiting for your merge."

[status.EX-3]
status = "ready"

[status.RK1]
status = "blocked"

# A board: chips in waves. With `auto`, the waves come from `needs` and the rows
# from each item's `repo`, or `rows_default`.
[[section]]
id = "board"
title = "The order"
kind = "board"
auto = true
types = ["pr", "setting"]
rows_title = "Repository"
rows_default = "example-service"
waves = ["No dependency", "After the liveness probe"]

# Results: each item's status and result, by default every item this phase
# sets under [status], in that order.
[[section]]
id = "results"
title = "Results"
kind = "results"

[[section]]
id = "questions"
title = "Questions"
kind = "items"
type = "question"

[[section.item]]
id = "Q1"
title = "The probe's timeout in production"
status = "done"
on = 2026-10-07
fields = [
  ["Question", "Staging allows five seconds. Production's database is slower at night: keep five, or allow ten?"],
  ["Answer", "Ten. A false failure takes the process out of service, and a slow answer costs nothing."],
]

[[section]]
id = "log"
title = "Log"
kind = "log"

[[section.entry]]
date = 2026-10-07
text = "[[EX-2]] opened, green. Your answer to [[Q1]] adds [[EX-3]] to the plan."

[[section.entry]]
date = 2026-10-06
text = "[[EX-1]] merged and released 1.4.0. You set [[S1]]."

[[changelog]]
date = 2026-10-07
text = "[[EX-2]] is open, and [[EX-3]] is new, from [[Q1]]."
changed = ["results", "q1"]

[[changelog]]
date = 2026-10-06
text = "[[EX-1]] merged, and [[S1]] is set."
changed = ["results"]
