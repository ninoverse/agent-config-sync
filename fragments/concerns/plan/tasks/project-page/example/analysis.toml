# Analysis: the decisions. Each lists its `options`, as [key, text] pairs;
# `recommended` names the option recommended, with its reasons in the fields,
# and `chosen` the one the user picked. The page marks the recommended option
# until one is chosen, and then only the chosen one. A decision waiting on the
# user is "open": it reads To decide, and shows under The owner; once
# answered, "done" reads Taken, and `on` is the day it was taken. Its card
# lists the PRs and settings that name it as Carried out by, so "lands in"
# needs no field of its own. The Analysis holds decisions and a few lines of
# prose: the evidence behind them goes in the Research.
[[section]]
id = "decisions"
title = "Decisions"
kind = "items"
type = "decision"

