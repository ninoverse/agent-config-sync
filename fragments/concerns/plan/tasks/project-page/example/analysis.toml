# Analysis: the decisions, each with its options, a recommendation, the
# answer and where it lands. A decision waiting on the user is "open": it reads
# To decide, and shows in Waiting on you; once answered, "done" reads Taken.
[[section]]
id = "decisions"
title = "Decisions"
kind = "items"
type = "decision"

[[section.item]]
id = "D1"
title = "Where the probes live"
