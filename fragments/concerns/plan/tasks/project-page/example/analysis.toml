# Analysis: the decisions, each with its options, a recommendation and the
# answer. A decision waiting on the user is "open": it reads To decide, and
# shows in Waiting on you; once answered, "done" reads Taken. `on` is the day
# it was taken. Its card lists the PRs that name it, so "lands in" needs no
# field of its own.
[[section]]
id = "decisions"
title = "Decisions"
kind = "items"
type = "decision"

