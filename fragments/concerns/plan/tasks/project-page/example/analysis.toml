# Analysis: the decisions. Each lists its `options`, as [key, text] pairs;
# `recommended` names the option recommended, with its reasons in the fields,
# and `chosen` the one the user picked. A decision waiting on the user is
# "open": it reads To decide, and shows in Waiting on you; once answered,
# "done" reads Taken, and `on` is the day it was taken. Its card lists the PRs
# that name it, so "lands in" needs no field of its own.
[[section]]
id = "decisions"
title = "Decisions"
kind = "items"
type = "decision"

[[section.item]]
id = "D1"
title = "Where the probes live"
status = "done"
on = 2026-10-02
options = [
  ["a", "<code>/healthz</code> and <code>/readyz</code> beside <code>/api</code>."],
  ["b", "A second port that serves only the probes."],
]
recommended = "a"
chosen = "a"
fields = [["Reasons", "One port keeps the platform's settings to two lines."]]

[[section.item]]
